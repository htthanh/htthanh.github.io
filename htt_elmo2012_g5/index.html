<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mimo Toán 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2350; --muted:#6b6790; --pri:#7c3aed; --pri-d:#5b21b6; --pri-l:#ede9fe;
  --ok:#22c55e; --ok-d:#15803d; --okbg:#dcfce7; --bad:#ef4444; --badbg:#fee2e2;
  --yel:#fcd34d; --yel-d:#d97706; --hl:#fde68a; --blue:#2563eb; --line:#e7e3f7; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:19px;line-height:1.4;
  background:linear-gradient(180deg,#7dd3fc 0%,#bae6fd 35%,#e0f7ff 65%,#d9f99d 100%) fixed;min-height:100vh;overflow-x:hidden}
body.padon{padding-bottom:250px}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
.cloud{position:fixed;font-size:90px;opacity:.85;z-index:0;pointer-events:none;animation:drift linear infinite;filter:drop-shadow(0 6px 0 #ffffff55)}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 90px;position:relative;z-index:1}
/* HUD */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.round,.avatar{width:52px;height:52px;border-radius:50%;border:none;background:#fff;font-size:1.5rem;font-weight:800;box-shadow:0 5px 0 #0000001f;flex:0 0 auto}
.avatar{font-size:1.9rem;background:#fff7d6}
.hname{flex:1;font-weight:800;font-size:1.25rem;color:#1e3a8a;text-shadow:0 2px 0 #fff;min-width:120px}
.progress{flex:1;min-width:120px;height:22px;background:#ffffffaa;border-radius:999px;overflow:hidden;box-shadow:inset 0 3px 0 #0000001a}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,#34d399,#22c55e);border-radius:999px;transition:width .5s cubic-bezier(.3,1.5,.6,1);box-shadow:inset 0 -5px 0 #0000001a}
.chipn{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;box-shadow:0 4px 0 #0000001a;white-space:nowrap}
.tog{width:44px;height:44px;border-radius:14px;border:none;background:#fff;font-size:1.2rem;box-shadow:0 4px 0 #0000001a}
/* buttons */
.btn{border:none;border-radius:18px;padding:10px 18px;font-weight:800;background:#fff;box-shadow:0 5px 0 #d6d3e8;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #d6d3e8}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri-d)}
.btn.go{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d);padding:8px 18px}
.btn.y{background:var(--yel);box-shadow:0 5px 0 var(--yel-d)}
.btn.big{font-size:1.25rem;padding:14px 26px;border-radius:22px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:28px;padding:16px 18px;box-shadow:0 8px 0 #00000014,0 12px 30px #0000000f;margin-bottom:16px}
.small{font-size:.9rem;color:var(--muted)}
.center{text-align:center}
/* mascot */
.mimo{flex:0 0 auto;position:relative}
.mimo svg{width:100%;height:100%;overflow:visible;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) scale(1.02,.98)}}
.mimo .e-happy,.mimo .e-sad,.mimo .m-happy,.mimo .m-sad,.mimo .m-think,.mimo .a-up{display:none}
.mimo.mood-happy .e-open,.mimo.mood-happy .m-idle,.mimo.mood-happy .a-down{display:none}
.mimo.mood-happy .e-happy,.mimo.mood-happy .m-happy,.mimo.mood-happy .a-up{display:inline}
.mimo.mood-happy svg{animation:hop .55s ease 2}
.mimo.mood-sad .m-idle{display:none}.mimo.mood-sad .m-sad,.mimo.mood-sad .e-sad{display:inline}
.mimo.mood-sad svg{animation:wob .5s}
.mimo.mood-think .m-idle{display:none}.mimo.mood-think .m-think{display:inline}
.mimo.mood-think .pupil{transform:translate(3px,-4px)}
.mimo .pupil{transition:transform .3s}
.mimo .e-open{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes hop{30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) scale(1.08,.92)}80%{transform:translateY(-6px) rotate(4deg)}}
@keyframes wob{20%,60%{transform:rotate(-7deg)}40%,80%{transform:rotate(7deg)}}
.mimo.dance svg{animation:dance .8s ease-in-out infinite}
@keyframes dance{25%{transform:rotate(-10deg) translateY(-10px)}50%{transform:translateY(0)}75%{transform:rotate(10deg) translateY(-10px)}}
/* scene + bubble */
.scene{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px}
.bwrap{flex:1;position:relative;margin-bottom:18px}
.bubble{background:#fff;border-radius:24px;padding:12px 48px 12px 16px;position:relative;min-height:56px;font-weight:600;
  box-shadow:0 6px 0 #00000014;border:3px solid #fff;transition:border-color .2s}
.bubble:before{content:"";position:absolute;left:-14px;bottom:14px;border:10px solid transparent;border-right:16px solid #fff}
.bubble.sad{border-color:#fca5a5}.bubble.happy{border-color:#86efac}.bubble.think{border-color:#fcd34d}
.spk{border:none;background:var(--pri-l);color:var(--pri);border-radius:14px;padding:4px 10px;font-weight:800;box-shadow:0 3px 0 #c4b5fd}
.bwrap>.spk{position:absolute;right:8px;top:8px;width:36px;height:36px;padding:0;border-radius:50%}
/* map */
.hero{display:flex;align-items:center;gap:8px}
.island{border-radius:34px;padding:14px 12px 10px;margin-bottom:22px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 10px 0 #00000014;position:relative;overflow:hidden}
.banner{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 14px;box-shadow:0 5px 0 #0000001a;position:relative;z-index:2}
.banner .be{font-size:2.2rem}
.banner b{font-size:1.15rem}
.banner .bc{margin-left:auto;background:var(--pri);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;white-space:nowrap}
.path{position:relative;width:320px;margin:0 auto}
.road{position:absolute;left:0;top:0}
.road path{fill:none;stroke:#ffffffcc;stroke-width:16;stroke-linecap:round}
.road path.d{stroke:#00000014;stroke-width:4;stroke-dasharray:2 14}
.node{position:absolute;width:78px;height:78px;border-radius:50%;border:none;font-size:1.7rem;font-weight:800;background:#fff;color:var(--pri);
  box-shadow:0 7px 0 #c9c3e6;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
.node:hover{transform:scale(1.08)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 #c9c3e6}
.node .ns{font-size:.7rem;letter-spacing:1px;color:#d1d5db;margin-top:2px}
.node .ns b{color:#f59e0b}
.node.done{background:linear-gradient(#fde047,#facc15);color:#7c2d12;box-shadow:0 7px 0 #ca8a04}
.node.next{background:var(--pri);color:#fff;box-shadow:0 7px 0 var(--pri-d);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 7px 0 var(--pri-d),0 0 0 0 #a78bfa99}70%{box-shadow:0 7px 0 var(--pri-d),0 0 0 18px #a78bfa00}}
.here{position:absolute;font-size:2.4rem;animation:hop 1.4s infinite;pointer-events:none;z-index:3}
.deco{position:absolute;font-size:2.2rem;opacity:.9;pointer-events:none}
/* question */
.qcard{background:linear-gradient(180deg,#fff 60%,var(--c1))}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qnum{width:44px;height:44px;border-radius:14px;background:var(--pri);color:#fff;font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--pri-d)}
.chip{background:var(--pri-l);color:var(--pri);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.9rem}
.qhead .spk{margin-left:auto}
.qtext{font-size:1.2rem;margin:10px 0 6px;font-weight:600}
details.en{color:var(--muted);font-size:.95rem}
details.en summary{cursor:pointer}
.bottombar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.hintbtn{width:64px;height:64px;border-radius:50%;border:none;background:var(--yel);font-size:1.9rem;box-shadow:0 6px 0 var(--yel-d);animation:glow 3s infinite}
@keyframes glow{0%,85%,100%{transform:scale(1)}90%{transform:scale(1.12) rotate(-8deg)}95%{transform:scale(1.12) rotate(8deg)}}
/* fractions */
.mx{display:inline-flex;align-items:center;vertical-align:middle;gap:2px;margin:0 2px}
.mw{font-weight:800}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.92em}
.fr>span:first-child,.fr>input:first-child{border-bottom:2.5px solid currentColor;padding:0 3px}
.fr>span{padding:0 3px}
/* steps */
.steps{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.step{display:flex;gap:10px;align-items:flex-start;border-radius:22px;padding:12px 14px;background:#f8f7ff;border:3px solid var(--line);animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateY(16px) scale(.97)}}
.step.cur{border-color:#a78bfa;background:#fff;box-shadow:0 6px 0 #ddd6fe}
.step.done{border-color:#86efac;background:#f0fdf4}
.snum{flex:0 0 36px;height:36px;border-radius:12px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 3px 0 var(--pri-d)}
.step.done .snum{background:var(--ok);box-shadow:0 3px 0 var(--ok-d);font-size:0}
.step.done .snum:after{content:"✓";font-size:1.2rem}
.sbody{flex:1;min-width:0}
.sq{margin-bottom:8px;font-weight:600}
.sok{color:var(--ok-d);font-size:.95rem;margin-top:6px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inp{width:4.2em;font-size:1.3rem;font-weight:800;padding:4px 6px;border:3px solid #d4cff0;border-radius:14px;text-align:center;background:#fff;color:var(--ink);caret-color:var(--pri)}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px #ddd6fe}
.fr .inp{width:3.2em;margin:2px 0;padding:2px 4px;font-size:1.1rem}
.mx .inp.w{width:2.6em}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{border:3px solid #ddd6fe;background:#fff;border-radius:18px;padding:8px 14px;font-weight:700;box-shadow:0 5px 0 #ddd6fe;transition:transform .1s}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:#a78bfa}
.choice.right{border-color:var(--ok);background:var(--okbg);box-shadow:0 5px 0 #86efac;animation:popin .4s}
.choice.wrongc{border-color:var(--bad);background:var(--badbg);box-shadow:0 5px 0 #fca5a5}
@keyframes popin{50%{transform:scale(1.1)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.visual{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:8px 0;align-items:center;font-size:1.3rem}
/* numpad */
.numpad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px #0000002a;padding:10px 12px 14px;transform:translateY(110%);transition:transform .25s}
.numpad.show{transform:none}
.numpad .grid4{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:620px;margin:0 auto}
.numpad button{border:none;border-radius:16px;height:52px;font-size:1.45rem;font-weight:800;background:var(--pri-l);color:var(--pri);box-shadow:0 4px 0 #c4b5fd}
.numpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c4b5fd}
.numpad .k-ok{grid-column:span 2;background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d);font-size:1.15rem}
.numpad .k-del{background:#fee2e2;color:#b91c1c;box-shadow:0 4px 0 #fca5a5}
.numpad .k-nav{background:#e0f2fe;color:#0369a1;box-shadow:0 4px 0 #7dd3fc;font-size:1.1rem}
.numpad .k-x{background:#f1f5f9;color:#64748b;box-shadow:0 4px 0 #cbd5e1;font-size:1rem}
/* long division */
.ldwrap{display:flex;justify-content:center;margin:10px 0}
.ldiv{display:flex;font-family:"Courier New",monospace;font-size:1.7rem;font-weight:700;background:#fffdf2;border-radius:22px;padding:14px 22px;border:3px dashed #fcd34d}
.ldleft{display:grid;gap:0;padding-right:10px}
.ldc{width:1.25em;height:1.5em;text-align:center}
.ldc.hl{background:var(--hl);border-radius:8px}
.ldc.new{color:var(--blue)}
.ldright{border-left:3px solid var(--ink);padding-left:10px;min-width:4em}
.ldright .dv{border-bottom:3px solid var(--ink);padding-bottom:2px}
.ldright .qt{color:var(--pri)}
.digits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.digits button{width:54px;height:54px;border-radius:18px;border:none;background:linear-gradient(#c4b5fd,#a78bfa);font-weight:800;font-size:1.4rem;color:#fff;box-shadow:0 5px 0 var(--pri-d)}
.digits button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.trial{text-align:center;margin:8px 0;min-height:1.5em;font-weight:600}
/* expressions */
.locks{text-align:center;font-size:2rem;letter-spacing:4px}
.expr{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;font-size:1.8rem;font-weight:800;margin:10px 0;padding:12px;background:#f5f3ff;border-radius:22px}
.expr .num{padding:0 4px;border-radius:10px}
.expr .num.f,.expr .opbtn.f{background:var(--hl)}
.expr .par{color:#a5a1c4}
.opbtn{border:none;background:#fff;color:var(--pri);font-weight:800;font-size:1.6rem;width:48px;height:48px;border-radius:16px;box-shadow:0 5px 0 #c4b5fd}
.opbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c4b5fd}
.opbtn.flash{animation:flash 1s 2}
@keyframes flash{50%{background:#facc15;transform:scale(1.15)}}
.exhist{font-size:1.15rem;margin:6px auto;max-width:600px;background:#fffdf2}
.exhist div{padding:2px 8px}
/* units */
.utable{margin:8px auto;border-collapse:collapse;font-size:1.4rem;font-weight:800;background:#fffdf2;border-radius:18px}
.utable td{padding:4px 10px;text-align:right;min-width:3.5em}
.utable .u{font-size:.85rem;color:var(--muted);font-weight:600}
.utable tr.res td{border-top:3px solid var(--ink);color:var(--pri)}
.utable td.fc{background:var(--hl);border-radius:8px}
.utable .carry{font-size:.85rem;color:var(--bad);height:1.2em}
.utable s{color:#a5a1c4}
.utable .nt{color:var(--blue);font-size:.9rem;display:block}
/* ninja */
.bigfrac{font-size:3.2rem;font-weight:800;text-align:center;margin:10px 0;color:var(--pri)}
.ninja{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ninja .nb{border:none;background:#312e81;color:#fff;border-radius:16px;padding:10px 14px;font-weight:800;box-shadow:0 5px 0 #1e1b4b}
.ninja .nb:active{transform:translateY(4px);box-shadow:0 1px 0 #1e1b4b}
.slash{animation:slash .5s}
@keyframes slash{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-8deg);color:#f43f5e}100%{transform:scale(1)}}
.hist{margin:8px auto;max-width:520px;font-size:1.2rem}
/* grids & boards */
.grid{display:inline-grid;gap:4px;background:#a5a1c4;padding:4px;border-radius:10px}
.grid .cell{width:44px;height:44px;background:#fff;border:none;border-radius:6px}
.grid .cell.on{background:#6d28d9}
.grid .cell.bad{outline:3px solid var(--bad);outline-offset:-3px}
.flipx{transition:transform 1s;transform-style:preserve-3d}
.board{display:grid;grid-template-columns:repeat(10,1fr) 52px;gap:4px;max-width:620px;margin:0 auto}
.board button{border:none;border-radius:10px;background:#f1effc;padding:6px 0;font-weight:800;font-size:1rem;box-shadow:0 3px 0 #ddd6fe}
.board button.on{background:#86efac;box-shadow:0 3px 0 #22c55e}
.board button.no{background:#fecaca}
.board .cnt{display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted)}
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.found span{background:var(--pri-l);border-radius:14px;padding:4px 12px;font-weight:800;min-width:60px;text-align:center;animation:popin .4s}
.found span.empty{background:#f1f5f9;color:#c4c1d9;animation:none}
.cards{display:flex;gap:10px;justify-content:center;margin:10px 0}
.ncard{width:58px;height:76px;border-radius:16px;border:none;background:linear-gradient(#f9a8d4,#ec4899);color:#fff;font-size:2rem;font-weight:800;box-shadow:0 6px 0 #be185d}
.ncard:active{transform:translateY(4px)}
.ncard:disabled{opacity:.35}
.slot{font-size:2.3rem;font-weight:800;letter-spacing:8px;text-align:center;min-height:1.6em;color:var(--pri)}
.machine{display:grid;grid-template-columns:auto auto auto auto auto;gap:8px 10px;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem}
.machine .sqr,.machine .hex,.machine .cir{width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.machine .sqr{background:#ffedd5;border:3px solid #fb923c;border-radius:10px}
.machine .hex{background:#fecdd3;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.machine .cir{background:#fff1f2;border:3px solid #fda4af;border-radius:50%}
.machine .q{background:#fff;color:var(--pri);outline:3px dashed #a78bfa}
.arrow{color:#60a5fa}
.diamond{position:relative;margin:10px auto}
.diamond div{position:absolute;width:58px;height:34px;border:2px solid #3b3561;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff}
.diamond div.g{background:#cbd5e1}
.diamond div.h{background:var(--hl)}
.diamond div.ans{color:var(--pri)}
.layers{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.layer{text-align:center}
.layer .grid .cell{width:38px;height:38px;font-weight:800}
.layer .grid .cell.x{background:repeating-linear-gradient(45deg,#e5e7eb 0 4px,#f3f4f6 4px 8px);cursor:default}
.layer .grid .cell.m{background:#facc15}
/* overlays */
.modal,.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#2b235099}
.celebrate{background:radial-gradient(circle at 50% 40%,#fef9c3ee,#c4b5fdee 70%)}
.modal .box,.celebrate .box{background:#fff;border-radius:32px;padding:22px;max-width:440px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.6,1);box-shadow:0 10px 0 #00000022}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bigstars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.bigstars span{font-size:3.4rem;opacity:0;animation:starpop .5s cubic-bezier(.3,1.8,.6,1) forwards}
.bigstars span.off{filter:grayscale(1);}
.bigstars span.off{animation-name:starpopoff}
@keyframes starpop{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:scale(1)}}
@keyframes starpopoff{from{opacity:0;transform:scale(0)}to{opacity:.25;transform:scale(.85)}}
.coins{font-size:1.4rem;font-weight:800;color:#b45309}
.sticker{display:inline-flex;flex-direction:column;align-items:center;background:linear-gradient(#fff,#fef3c7);border:4px dashed #f59e0b;border-radius:24px;padding:8px 18px;margin:8px 0;animation:flipin .8s .9s both}
.sticker .se{font-size:3.6rem;line-height:1.1}
@keyframes flipin{from{transform:rotateY(90deg) scale(.5);opacity:0}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.slotS{background:#fff;border-radius:22px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #0000001a;border:none}
.slotS .se{font-size:2.6rem;line-height:1.1}
.slotS.no .se{filter:brightness(0) opacity(.15)}
.slotS:active .se{animation:wob .5s}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.avs button{width:56px;height:56px;border-radius:50%;border:3px solid transparent;background:#f5f3ff;font-size:1.9rem}
.avs button.sel{border-color:var(--pri);background:#ede9fe;transform:scale(1.1)}

@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ================= tiện ích ================= */
const LS='g5_2012_minigame_v1';
let P={};
try{P=JSON.parse(localStorage.getItem(LS))||{}}catch(e){P={}}
if(!P.stars)P.stars={};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}};
const app=document.getElementById('app');
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;
}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const fr=(w,n,d)=>`<span class="mx">${w?`<b class="mw">${w}</b>`:''}<span class="fr"><span>${n}</span><span>${d}</span></span></span>`;
// {4 6/7} hoặc {6/7} -> phân số đẹp
const T=s=>String(s==null?'':s).replace(/\{(?:(\d+) )?(\d+)\/(\d+)\}/g,(m,w,n,d)=>fr(w,n,d));
const fmt=n=>{const s=String(Math.round(n*1000)/1000).replace('.',',');const [i,d]=s.split(',');return i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d?','+d:'')};
const parseNum=s=>{s=String(s).trim().replace(/\s/g,'');if(s==='')return NaN;
  // 91,02 -> 91.02 ; 5.428 (kiểu VN hàng nghìn) -> 5428
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Number(s)};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* âm thanh */
let AC=null;
function beep(f=660,d=.12,type='sine',vol=.12){
  if(P.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
const sOk=()=>{beep(660);setTimeout(()=>beep(880),90)};
const sBad=()=>beep(180,.22,'square',.06);
const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*130));

/* ================= trạng thái 1 lượt chơi ================= */
const G={q:null,mist:0,hint:0,hintFn:null,bubble:null,owl:null,finished:false};
function say(html,mood=''){
  if(!G.bubble)return;
  G.bubble.className='bubble '+mood;G.bubble.innerHTML=T(html);G.lastSay=html;
  setMood(mood);speak(html);
}
const PRAISE=['Giỏi quá! 🎉','Chính xác! 👏','Tuyệt vời! ⭐','Đúng rồi, tiếp tục nào! 🚀','Bạn làm tốt lắm! 💪','Xuất sắc! 🌟'];
const OOPS=['Chưa đúng rồi, thử lại nhé! 🤔','Gần đúng rồi! Kiểm tra lại phép tính nha.','Ôi, sai mất rồi. Bình tĩnh tính lại nhé!','Thử lại một lần nữa nào, bạn làm được mà!'];
function praise(extra){say((extra?extra+' ':'')+pick(PRAISE),'happy')}
function bad(msg,node){G.mist++;sBad();say(msg||pick(OOPS),'sad');if(node){node.classList.remove('shake');void node.offsetWidth;node.classList.add('shake')}}
function useHint(){
  if(G.finished)return;
  const t=G.hintFn?G.hintFn():null;
  if(!t){say('Bạn đang làm rất tốt, cứ tiếp tục nhé!','think');return}
  G.hint++;say('💡 '+t,'think');
}

/* ================= bước hướng dẫn (quest) ================= */
const FORM={ 'form-simp':'Đúng giá trị rồi! Nhưng hãy <b>rút gọn</b> phân số đến tối giản nhé.',
  'form-mixed':'Đúng giá trị rồi! Hãy viết thành <b>hỗn số</b> (phần phân số phải nhỏ hơn 1).',
  'form-imp':'Ở bước này hãy viết dạng <b>phân số</b> (không có phần nguyên) nhé.',
  'empty':'Bạn điền đủ các ô trước đã nhé!' };
function parseFracStr(s){const m=String(s).match(/^(?:(\d+) )?(\d+)\/(\d+)$/);return [m[1]?+m[1]:0,+m[2],+m[3]]}
function makeInput(inp){
  const t=inp.t||'num';
  if(t==='num'){
    const e=h('input',{class:'inp',inputmode:'none',autocomplete:'off',style:`width:${Math.max(3.2,String(inp.a).length*0.75+1.6)}em`});
    return [e,()=>{const v=parseNum(e.value);if(isNaN(v))return'empty';return Math.abs(v-inp.a)<1e-9?'ok':'wrong'}];
  }
  if(t==='fnum'){ // tử số cần điền, mẫu cố định
    const e=h('input',{class:'inp',inputmode:'none',autocomplete:'off'});
    const node=h('span',{class:'mx'},h('span',{class:'fr'},e,h('span',{},String(inp.den))));
    return [node,()=>{const v=parseNum(e.value);if(isNaN(v))return'empty';return v===inp.a?'ok':'wrong'}];
  }
  // frac
  const ew=inp.whole?h('input',{class:'inp w',inputmode:'none',autocomplete:'off'}):null;
  const en=h('input',{class:'inp',inputmode:'none',autocomplete:'off'});
  const ed=h('input',{class:'inp',inputmode:'none',autocomplete:'off'});
  const node=h('span',{class:'mx'},ew,h('span',{class:'fr'},en,ed));
  return [node,()=>{
    const ws=ew?ew.value.trim():'';const w=ws===''?0:parseInt(ws),n=parseInt(en.value),d=parseInt(ed.value);
    if(isNaN(n)||isNaN(d)||isNaN(w))return 'empty';
    if(d===0)return 'wrong';
    const [aw,an,ad]=parseFracStr(inp.a);
    if((w*d+n)*ad!==(aw*ad+an)*d)return 'wrong';
    if(inp.form==='final'){if(n!==0&&gcd(n,d)!==1)return'form-simp';if(n>=d)return'form-mixed'}
    if(inp.form==='imp'&&w!==0)return'form-imp';
    return 'ok';
  }];
}
function quest(box,steps,done){
  const wrap=h('div',{class:'steps'});box.append(wrap);
  let i=0;
  const run=()=>{
    G.prog&&G.prog(i,steps.length);
    if(i>=steps.length){G.hintFn=null;(done||finish)();return}
    const st=steps[i];
    st.onShow&&st.onShow();
    G.hintFn=()=>st.hint||'Đọc thật kỹ câu hỏi, rồi tính từng bước nhé!';
    const row=h('div',{class:'step cur'});
    const body=h('div',{class:'sbody'});
    row.append(h('div',{class:'snum'},String(i+1)),body);
    body.append(h('div',{class:'sq',html:T(st.q)}));
    const okDone=()=>{
      row.classList.remove('cur');row.classList.add('done');
      body.querySelectorAll('input,button').forEach(e=>e.disabled=true);
      if(st.ok)body.append(h('div',{class:'sok',html:'✅ '+T(st.ok)}));
      sOk();praise();st.onOk&&st.onOk();i++;setTimeout(run,300);
    };
    if(st.choices){
      const cw=h('div',{class:'choices'});
      st.choices.forEach((c,k)=>{const b=h('button',{class:'choice',html:T(c),onclick:()=>{
        if(k===st.ans){b.classList.add('right');okDone()}
        else{b.classList.add('wrongc');bad(st.why&&st.why[k],row)}}});cw.append(b)});
      body.append(cw);
    }else{
      const line=h('div',{class:'inline'});const checks=[];
      st.inputs.forEach(inp=>{
        if(inp.pre)line.append(h('span',{html:T(inp.pre)}));
        const [node,chk]=makeInput(inp);line.append(node);checks.push(chk);
        if(inp.post)line.append(h('span',{html:T(inp.post)}));
      });
      const btn=h('button',{class:'btn go',onclick:()=>{
        let res='ok';for(const c of checks){const r=c();if(r!=='ok'){res=r;break}}
        if(res==='ok')okDone();else if(FORM[res])say(FORM[res],'think');else bad(st.wrong,row);
      }},'Kiểm tra');
      line.append(btn);body.append(line);
      line.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()});
      setTimeout(()=>{const f=line.querySelector('input');f&&f.focus({preventScroll:true})},50);
    }
    wrap.append(row);
    setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  };
  run();
}

/* ================= các loại trò chơi ================= */

/* ---- 1. Chia kiểu cột: "Đoán thương" ---- */
function gameDiv(area,{a,b}){
  const ds=String(a).split('').map(Number);
  const plan=[];let idx=0,p=0;
  do{p=p*10+ds[idx];idx++}while(p<b&&idx<ds.length);
  for(;;){const q=Math.floor(p/b),r=p-q*b;plan.push({p,q,r,end:idx-1});if(idx>=ds.length)break;p=r*10+ds[idx];idx++}
  const rows=[];let k=0,qstr='',phase='guess';
  const box=h('div',{class:'ldiv'});area.append(h('div',{class:'ldwrap'},box));
  const trial=h('div',{class:'trial'});const ctrl=h('div');area.append(trial,ctrl);
  const N=ds.length;
  function draw(){
    box.innerHTML='';
    const left=h('div',{class:'ldleft',style:`grid-template-columns:repeat(${N},1.25em)`});
    ds.forEach((d,j)=>left.append(h('div',{class:'ldc'+(k===0&&phase!=='end'&&j<=plan[0].end?' hl':'')},String(d))));
    rows.forEach((r,ri)=>{
      const s=r.str;const start=r.end-s.length+1;
      for(let j=0;j<N;j++){const ch=(j>=start&&j<=r.end)?s[j-start]:'';
        left.append(h('div',{class:'ldc'+(r.cur&&ch?' hl':'')+(r.newIdx===j?' new':'')},ch))}
    });
    const right=h('div',{class:'ldright'},h('div',{class:'dv'},String(b)),h('div',{class:'qt'},qstr+(phase==='end'?'':'?')));
    box.append(left,right);
  }
  function guess(){
    phase='guess';const st=plan[k];draw();trial.innerHTML='';
    ctrl.innerHTML='';
    ctrl.append(h('div',{class:'center',html:`Lấy <b>${st.p}</b> chia cho <b>${b}</b> được mấy? Bấm để thử:`}));
    const dg=h('div',{class:'digits'});
    for(let g=0;g<=9;g++)dg.append(h('button',{onclick:()=>tryG(g)},String(g)));
    ctrl.append(dg);
    G.hintFn=()=>{
      if(b<10)return `Nhớ bảng nhân ${b}: tìm số lớn nhất mà ${b} × số đó không vượt quá ${st.p}. Ví dụ ${b} × ${st.q} = ${b*st.q}, còn ${b} × ${st.q+1} = ${b*(st.q+1)}.`;
      const pw=Math.pow(10,String(b).length-1),br=Math.round(b/pw)*pw;
      return `Làm tròn ${b} ≈ ${br}. Ước lượng: ${st.p} : ${br} ≈ ${Math.floor(st.p/br)}. Thử số đó xem, nếu lớn quá thì giảm đi 1 nhé!`;
    };
    say(k===0?`Bắt đầu từ trái sang: lấy <b>${st.p}</b> (số nhỏ nhất ở đầu số bị chia mà chia được cho ${b}).`:`Bây giờ chia <b>${st.p}</b> cho <b>${b}</b>.`);
  }
  function tryG(g){
    const st=plan[k],pr=g*b;
    if(pr>st.p){trial.innerHTML=`${g} × ${b} = ${pr} &gt; ${st.p} → <b style="color:var(--bad)">Lớn quá!</b> Chọn số nhỏ hơn.`;sBad();say('Lớn quá rồi, giảm xuống nhé!','think');return}
    if(st.p-pr>=b){trial.innerHTML=`${g} × ${b} = ${pr}; còn dư ${st.p} − ${pr} = ${st.p-pr} ≥ ${b} → <b style="color:var(--warn)">Còn chia được nữa!</b> Chọn số lớn hơn.`;sBad();say('Số dư vẫn lớn hơn số chia, tăng lên nhé!','think');return}
    trial.innerHTML=`${g} × ${b} = ${pr} ≤ ${st.p} ✓`;qstr+=String(g);sOk();praise(`Viết <b>${g}</b> vào thương.`);remStep();
  }
  function remStep(){
    phase='rem';draw();const st=plan[k];ctrl.innerHTML='';
    const e=h('input',{class:'inp',inputmode:'none'});
    const go=()=>{const v=parseNum(e.value);if(isNaN(v)){say(FORM.empty,'think');return}
      if(v!==st.r){bad(`Tính lại nhé: ${st.p} − ${st.q*b} = ?`,ctrl);return}
      sOk();rows.forEach(r=>r.cur=false);G.prog&&G.prog(k+1,plan.length+1);
      if(k<plan.length-1){bring()}else{rows.push({str:String(st.r),end:st.end,cur:false});finalStep()}};
    e.addEventListener('keydown',ev=>{if(ev.key==='Enter')go()});
    ctrl.append(h('div',{class:'inline',style:'justify-content:center'},
      h('span',{html:`${st.q} nhân ${b} bằng ${st.q*b}. &nbsp;${st.p} − ${st.q*b} = `}),e,h('button',{class:'btn go',onclick:go},'Kiểm tra')));
    G.hintFn=()=>`Lấy ${st.p} trừ đi ${st.q*b}.`;
    setTimeout(()=>e.focus({preventScroll:true}),50);
  }
  function bring(){
    phase='bring';const st=plan[k],nx=plan[k+1];
    const digit=ds[nx.end];
    ctrl.innerHTML='';
    ctrl.append(h('div',{class:'center'},h('button',{class:'btn y',onclick:()=>{
      rows.push({str:String(st.r)+String(digit),end:nx.end,cur:true,newIdx:nx.end});k++;praise(`Hạ ${digit} xuống, được ${nx.p}.`);guess()}},`⬇️ Hạ chữ số ${digit} xuống`)));
    say(`Số dư là ${st.r}. Bây giờ hạ chữ số tiếp theo xuống nhé!`);
    G.hintFn=()=>`Bấm nút vàng để hạ chữ số ${digit} xuống cạnh số dư ${st.r}.`;
  }
  function finalStep(){
    phase='end';draw();ctrl.innerHTML='';trial.innerHTML='';
    const q=Math.floor(a/b),r=a%b;
    quest(ctrl,[{q:`Vậy ${fmt(a)} : ${b} = ? (dư ?)`,inputs:[{a:q},{a:r,pre:'dư'}],
      hint:`Thương là số màu tím bên phải, số dư là số cuối cùng bên trái.`,
      ok:`Thử lại: ${q} × ${b} + ${r} = ${fmt(a)} ✓`}]);
  }
  guess();
}

/* ---- 2. Biểu thức: "Mở khóa rương" ---- */
function tokenize(s){const out=[];const re=/\d+|[-+×÷()]/g;let m;while((m=re.exec(s))){const x=m[0];
  if(/\d/.test(x))out.push({t:'n',v:+x});else if(x==='('||x===')')out.push({t:x});else out.push({t:'op',v:x})}return out}
function simpPar(tk){let ch=true;while(ch){ch=false;for(let j=0;j+2<tk.length;j++){if(tk[j].t==='('&&tk[j+1].t==='n'&&tk[j+2].t===')'){tk.splice(j,3,tk[j+1]);ch=true;break}}}}
function nextOp(tk){
  let lo=0,hi=tk.length-1;const close=tk.findIndex(x=>x.t===')');
  if(close>=0){let open=close;while(tk[open].t!=='(')open--;lo=open+1;hi=close-1}
  for(let j=lo;j<=hi;j++)if(tk[j].t==='op'&&(tk[j].v==='×'||tk[j].v==='÷'))return{j,lo,hi};
  for(let j=lo;j<=hi;j++)if(tk[j].t==='op')return{j,lo,hi};
}
const SYM={'+':'+','-':'−','×':'×','÷':':'};
const exprStr=tk=>tk.map(t=>t.t==='n'?fmt(t.v):t.t==='op'?SYM[t.v]:t.t).join(' ').replace(/\( /g,'(').replace(/ \)/g,')');
function gameExpr(area,{e}){
  const tk=tokenize(e);simpPar(tk);
  const total=tk.filter(t=>t.t==='op').length;let opened=0;
  const locks=h('div',{class:'locks'}),ex=h('div',{class:'expr'}),ask=h('div',{class:'center'}),hist=h('div',{class:'exhist card'});
  area.append(h('div',{class:'center small'},'Mỗi phép tính đúng mở được 1 ổ khóa. Mở hết để lấy kho báu! Bấm vào phép tính phải làm TRƯỚC.'),locks,ex,ask,hist);
  hist.append(h('div',{},exprStr(tk)));
  let focus=null;
  function draw(){
    locks.textContent='🔓'.repeat(opened)+'🔒'.repeat(total-opened)+'  '+(opened===total?'💎':'🎁');
    ex.innerHTML='';
    tk.forEach((t,j)=>{
      const f=focus!=null&&j>=focus-1&&j<=focus+1;
      if(t.t==='op')ex.append(h('button',{class:'opbtn'+(f?' f':''),'data-j':j,onclick:()=>choose(j)},SYM[t.v]));
      else ex.append(h('span',{class:(t.t==='n'?'num':'par')+(f?' f':'')},t.t==='n'?fmt(t.v):t.t));
    });
  }
  function reason(j){const n=nextOp(tk);
    if(tk.some(t=>t.t==='(')&&(j<n.lo||j>n.hi))return'Có dấu ngoặc! Phải làm phép tính <b>trong ngoặc</b> (ngoặc trong cùng) trước nhé.';
    if((tk[j].v==='+'||tk[j].v==='-')&&(tk[n.j].v==='×'||tk[n.j].v==='÷'))return'Nhớ quy tắc: <b>nhân, chia trước — cộng, trừ sau</b>!';
    return'Các phép tính cùng loại thì làm <b>từ trái sang phải</b> nhé!'}
  function choose(j){
    if(focus!=null)return;
    const n=nextOp(tk);
    if(j!==n.j){bad(reason(j),ex);return}
    focus=j;draw();
    const A=tk[j-1].v,B=tk[j+1].v,op=tk[j].v;
    const res=op==='+'?A+B:op==='-'?A-B:op==='×'?A*B:A/B;
    ask.innerHTML='';
    const inp=h('input',{class:'inp',inputmode:'none'});
    const go=()=>{const v=parseNum(inp.value);if(isNaN(v)){say(FORM.empty,'think');return}
      if(v!==res){bad(`Tính lại: ${A} ${SYM[op]} ${B} = ?`,ask);return}
      tk.splice(j-1,3,{t:'n',v:res});simpPar(tk);opened++;G.prog&&G.prog(opened,total);focus=null;ask.innerHTML='';sOk();
      hist.append(h('div',{},'= '+exprStr(tk)));
      draw();
      if(tk.length===1){say(`Mở hết khóa rồi! Kết quả là <b>${fmt(res)}</b> 💎`,'happy');G.hintFn=null;setTimeout(finish,600)}
      else {praise();G.hintFn=hintNext}};
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')go()});
    ask.append(h('div',{class:'inline',style:'justify-content:center;font-size:1.3rem'},h('span',{},`${fmt(A)} ${SYM[op]} ${fmt(B)} = `),inp,h('button',{class:'btn go',onclick:go},'Kiểm tra')));
    G.hintFn=()=>`Tính ${A} ${SYM[op]} ${B}.`;
    setTimeout(()=>inp.focus({preventScroll:true}),50);
    say('Đúng phép tính cần làm trước rồi! Giờ tính kết quả nào.','happy');
  }
  function hintNext(){const n=nextOp(tk);const b=ex.querySelector(`[data-j="${n.j}"]`);if(b){b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
    return 'Thứ tự: ① trong ngoặc trước ② nhân, chia ③ cộng, trừ — cùng loại thì trái sang phải. Phép tính nhấp nháy là phép cần làm!'}
  G.hintFn=hintNext;
  draw();
  say('Nhìn kỹ biểu thức: có ngoặc không? có nhân chia không? Bấm vào phép tính phải làm trước tiên!');
}

/* ---- 3. Cộng trừ số đo nhiều đơn vị: "Máy đổi đơn vị" ---- */
function gameUnits(area,{names,base,top,bot,op,done}){
  const n=names.length,res=Array(n).fill(null),carry=Array(n).fill(0),nt=Array(n).fill(null);let fc=n-1;
  const tbl=h('table',{class:'utable'});area.append(tbl);
  function draw(){
    tbl.innerHTML='';
    const rc=h('tr');rc.append(h('td'));for(let i=0;i<n;i++)rc.append(h('td',{class:'carry'},op==='+'&&carry[i]?`+${carry[i]} nhớ`:''));tbl.append(rc);
    const r1=h('tr');r1.append(h('td'));for(let i=0;i<n;i++){const td=h('td',{class:i===fc?'fc':''});
      if(nt[i]!=null)td.innerHTML=`<span class="nt">${nt[i]}</span><s>${top[i]}</s> <span class="u">${names[i]}</span>`;
      else td.innerHTML=`${top[i]} <span class="u">${names[i]}</span>`;r1.append(td)}tbl.append(r1);
    const r2=h('tr');r2.append(h('td',{},op==='+'?'+':'−'));for(let i=0;i<n;i++)r2.append(h('td',{class:i===fc?'fc':'',html:bot[i]==null?'':`${bot[i]} <span class="u">${names[i]}</span>`}));tbl.append(r2);
    const r3=h('tr',{class:'res'});r3.append(h('td'));for(let i=0;i<n;i++)r3.append(h('td',{html:res[i]==null?'?':`${res[i]} <span class="u">${names[i]}</span>`}));tbl.append(r3);
  }
  const B=i=>bot[i]||0;
  const steps=[];
  if(op==='+'){let c=0;
    for(let i=n-1;i>=0;i--){const s=top[i]+B(i)+c;const cc=c;
      const st={q:`Cột <b>${names[i]}</b>: ${top[i]} + ${B(i)}${cc?` + ${cc} (nhớ)`:''} = ?`,inputs:[{a:s,post:names[i]}],
        hint:`Cộng các số ở cột ${names[i]}${cc?', đừng quên số nhớ '+cc:''}.`,onShow:()=>{fc=i;draw()}};
      steps.push(st);
      if(i>0&&s>=base[i]){const nc=Math.floor(s/base[i]),r=s%base[i];
        steps.push({q:`${s} ${names[i]} ≥ ${base[i]} ${names[i]} nên phải đổi! (1 ${names[i-1]} = ${fmt(base[i])} ${names[i]})<br>${fmt(s)} ${names[i]} = ? ${names[i-1]} ? ${names[i]}`,
          inputs:[{a:nc,post:names[i-1]},{a:r,post:names[i]}],hint:`${fmt(s)} − ${fmt(base[i])} = ${fmt(s-base[i])}. Vậy ${fmt(s)} ${names[i]} = 1 ${names[i-1]} ${fmt(s-base[i])} ${names[i]}.`,
          ok:`Viết ${r} ${names[i]}, nhớ ${nc} ${names[i-1]} sang cột bên trái.`,onOk:()=>{res[i]=r;carry[i-1]=nc;draw()}});c=nc;
      }else{st.onOk=()=>{res[i]=s;draw()};c=0}
    }
  }else{let bw=0;
    for(let i=n-1;i>=0;i--){const t=top[i]-bw;
      if(t<B(i)&&i>0){const t2=t+base[i];
        steps.push({q:`Cột <b>${names[i]}</b>: ${t} &lt; ${B(i)} nên không trừ được! Mượn 1 ${names[i-1]} = ${fmt(base[i])} ${names[i]}.<br>${t} + ${fmt(base[i])} = ?`,
          inputs:[{a:t2,post:names[i]}],hint:`Cộng thêm ${fmt(base[i])} vào ${t}.`,onShow:()=>{fc=i;draw()},
          onOk:()=>{nt[i]=t2;nt[i-1]=top[i-1]-1;draw()}});
        steps.push({q:`${fmt(t2)} − ${B(i)} = ?`,inputs:[{a:t2-B(i),post:names[i]}],hint:`Trừ như bình thường: ${fmt(t2)} − ${B(i)}.`,onOk:()=>{res[i]=t2-B(i);draw()}});bw=1;
      }else{
        steps.push({q:`Cột <b>${names[i]}</b>${bw?` (đã cho mượn 1 nên còn ${t})`:''}: ${t} − ${B(i)} = ?`,inputs:[{a:t-B(i),post:names[i]}],
          hint:bw?`Cột này đã cho mượn 1, nên lấy ${t} (không phải ${top[i]}) trừ ${B(i)}.`:`Trừ ${t} − ${B(i)}.`,onShow:()=>{fc=i;draw()},onOk:()=>{res[i]=t-B(i);draw()}});bw=0;
      }
    }
  }
  draw();
  say('Làm từ cột <b>đơn vị nhỏ nhất</b> (bên phải) sang trái. Nhớ đổi đơn vị khi cần nhé!');
  quest(area,steps,()=>{fc=-1;draw();const s=res.map((v,i)=>`${v} ${names[i]}`).join(' ');say(`Kết quả: <b>${s}</b> 🎉`,'happy');if(done)done(res);else setTimeout(finish,500)});
}

/* ---- 4. Rút gọn phân số: "Ninja chém phân số" ---- */
function gameSimplify(area,{n,d}){
  let cn=n,cd=d;
  const big=h('div',{class:'bigfrac',html:fr(0,cn,cd)});
  const hist=h('div',{class:'hist center'});
  const btns=h('div',{class:'ninja'});
  [2,3,5,7,11,13,17].forEach(p=>btns.append(h('button',{class:'nb',onclick:()=>cut(p)},`🗡️ : ${p}`)));
  const doneB=h('button',{class:'btn pri',onclick:()=>{if(gcd(cn,cd)===1){G.hintFn=null;say(`Phân số ${fr(0,cn,cd)} đã tối giản! Vậy ${fr(0,n,d)} = ${fr(0,cn,cd)}.`,'happy');btns.querySelectorAll('button').forEach(b=>b.disabled=true);doneB.disabled=true;setTimeout(finish,500)}
    else bad(`Chưa đâu! ${cn} và ${cd} vẫn cùng chia hết cho một số nữa.`,big)}},'✋ Tối giản rồi!');
  area.append(h('div',{class:'center small'},'Chọn thanh kiếm để chia CẢ tử số và mẫu số cho cùng một số. Chém đến khi không chia được nữa!'),big,btns,h('div',{class:'center',style:'margin-top:10px'},doneB),hist);
  function cut(p){
    if(cn%p===0&&cd%p===0){hist.append(h('div',{html:`${fr(0,cn,cd)} = ${fr(0,cn+' : '+p,cd+' : '+p)} = ${fr(0,cn/p,cd/p)}`}));
      cn/=p;cd/=p;big.innerHTML=fr(0,cn,cd);big.classList.remove('slash');void big.offsetWidth;big.classList.add('slash');sOk();praise('Xoẹt!')}
    else bad(`${cn%p?cn:cd} không chia hết cho ${p}. Thử số khác nhé!`,big);
  }
  G.hintFn=()=>{for(const p of [2,3,5,7,11,13,17])if(cn%p===0&&cd%p===0)return `Cả ${cn} và ${cd} đều chia hết cho <b>${p}</b>. (Mẹo: số chẵn chia hết cho 2; tổng các chữ số chia hết cho 3 thì số đó chia hết cho 3.)`;
    return 'Không còn số nào chia hết cả tử và mẫu (trừ 1) → bấm "Tối giản rồi!".'};
  say(`Rút gọn ${fr(0,n,d)}. Tìm số mà cả ${n} và ${d} đều chia hết nhé!`);
}

/* ---- hình vẽ hỗ trợ ---- */
function pie(k,d,sz=58,col='#f97316'){
  let s=`<svg width="${sz}" height="${sz}" viewBox="-1.1 -1.1 2.2 2.2">`;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;
    s+=`<path d="M0 0 L${Math.cos(a0).toFixed(3)} ${Math.sin(a0).toFixed(3)} A1 1 0 0 1 ${Math.cos(a1).toFixed(3)} ${Math.sin(a1).toFixed(3)} Z" fill="${i<k?col:'#fff7ed'}" stroke="#7c2d12" stroke-width="0.04"/>`}
  return s+'</svg>';
}
function pies(w,n,d,col){let s='';for(let i=0;i<w;i++)s+=pie(d,d,46,col);if(n)s+=pie(n,d,46,col);return `<span style="display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle">${s}</span>`}
function crossFig(qd,sz=72){const c=sz/2,L=sz*.4,sx=qd[1]==='L'?-1:1,sy=qd[0]==='U'?-1:1;
  return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}"><g stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"><line x1="${c-L}" y1="${c}" x2="${c+L}" y2="${c}"/><line x1="${c}" y1="${c-L}" x2="${c}" y2="${c+L}"/><line x1="${c+sx*L}" y1="${c}" x2="${c}" y2="${c+sy*L}"/></g></svg>`}
function dotsFig(n,s=22){const m=n+1,W=n*s+12;let t=`<svg width="${W}" height="${W}" viewBox="-6 -6 ${W} ${W}">`;
  for(let i=0;i<m;i++){t+=`<line x1="0" y1="${i*s}" x2="${n*s}" y2="${i*s}" stroke="#94a3b8" stroke-dasharray="3 3"/><line x1="${i*s}" y1="0" x2="${i*s}" y2="${n*s}" stroke="#94a3b8" stroke-dasharray="3 3"/>`}
  for(let i=0;i<m;i++)for(let j=0;j<m;j++)t+=`<circle cx="${j*s}" cy="${i*s}" r="3.6" fill="#1e293b"/>`;return t+'</svg>'}

const mascot=(sz=104)=>h('div',{class:'mimo mood-idle',style:`width:${sz}px;height:${sz}px`,html:MIMO_SVG});
function setMood(m){const el=G.owl;if(!el)return;el.className='mimo mood-idle';void el.offsetWidth;el.className='mimo mood-'+(m||'idle')}

/* giọng đọc */
let VI=null;
function loadVoices(){try{VI=speechSynthesis.getVoices().find(v=>/^vi/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function toSpeech(html){
  const d=document.createElement('div');d.innerHTML=T(html);
  d.querySelectorAll('.mx').forEach(mx=>{const w=mx.querySelector('.mw');const f=mx.querySelectorAll('.fr>span');
    mx.replaceWith(' '+(w?w.textContent+' và ':'')+(f.length===2?f[0].textContent+' phần '+f[1].textContent:'')+' ')});
  return d.textContent.replace(/\p{Extended_Pictographic}|️|‍/gu,'')
    .replace(/×/g,' nhân ').replace(/ : /g,' chia ').replace(/−/g,' trừ ').replace(/\+/g,' cộng ')
    .replace(/=\s*\?/g,' bằng bao nhiêu?').replace(/=/g,' bằng ').replace(/≤/g,' bé hơn hoặc bằng ').replace(/≥/g,' lớn hơn hoặc bằng ')
    .replace(/</g,' bé hơn ').replace(/>/g,' lớn hơn ').replace(/cm²/g,' xăng-ti-mét vuông').replace(/\bcm\b/g,' xăng-ti-mét').replace(/\s+/g,' ');
}
function speak(html){
  if(P.voice===false||!('speechSynthesis' in window))return;
  const txt=toSpeech(html);if(!txt.trim())return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='vi-VN';if(VI)u.voice=VI;u.rate=1;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}

/* bàn phím số */
let padT=null;
const pad=h('div',{class:'numpad'});
(()=>{const g=h('div',{class:'grid4'});
  const keys=['1','2','3','4','5','⌫','6','7','8','9','0',',','⬅','➡','✕','OK'];
  keys.forEach(k=>{const cls=k==='OK'?'k-ok':k==='⌫'?'k-del':(k==='⬅'||k==='➡')?'k-nav':k==='✕'?'k-x':'';
    const b=h('button',{class:cls,type:'button'},k==='OK'?'✔ Kiểm tra':k==='✕'?'Ẩn':k);
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.addEventListener('click',()=>padKey(k));g.append(b)});
  pad.append(g);document.body.append(pad)})();
function padKey(k){
  const t=padT;if(!t||t.disabled){hidePad();return}
  beep(520,.04,'sine',.05);
  const all=[...document.querySelectorAll('.inp')].filter(e=>!e.disabled);const i=all.indexOf(t);
  if(k==='⌫')t.value=t.value.slice(0,-1);
  else if(k==='➡'){if(all[i+1])all[i+1].focus()}
  else if(k==='⬅'){if(all[i-1])all[i-1].focus()}
  else if(k==='✕'){t.blur();hidePad()}
  else if(k==='OK')t.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
  else if(t.value.length<8)t.value+=k;
}
function hidePad(){pad.classList.remove('show');document.body.classList.remove('padon')}
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('inp')){padT=e.target;pad.classList.add('show');document.body.classList.add('padon')}});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains('inp')))hidePad()},120));

/* mây trang trí */
[[8,70,'0s'],[30,110,'-25s'],[18,60,'-50s']].forEach(([top,dur,del])=>document.body.append(h('div',{class:'cloud',style:`top:${top}vh;animation-duration:${dur}s;animation-delay:${del}`},'☁️')));

/* ================= màn hình ================= */
function totals(){let st=0,pt=0;QS.forEach(q=>{const s=P.stars[q.id]||0;st+=s;if(s)pt+=q.pts});return{st,pt:Math.round(pt*10)/10}}
function hud(back){
  const t=totals();
  return h('div',{class:'hud'},
    back?h('button',{class:'round',title:'Về bản đồ',onclick:()=>{location.hash=''}},'✕'):h('button',{class:'avatar',title:'Đổi tên / nhân vật',onclick:askName},P.avatar||'🙂'),
    back?h('div',{class:'progress'},h('div',{class:'bar',id:'pbar'})):h('div',{class:'hname'},`Chào ${P.name||'bạn'}!`),
    h('span',{class:'chipn',title:'Số sao'},`⭐ ${t.st}`),
    h('span',{class:'chipn',title:'Xu'},`🪙 ${t.st*10}`),
    back?null:h('span',{class:'chipn',title:'Điểm bài thi'},`🏆 ${fmt(t.pt)}`),
    back?null:h('button',{class:'tog',title:'Bộ sưu tập nhãn dán',onclick:()=>{location.hash='album'}},'📒'),
    h('button',{class:'tog',title:'Bật/tắt giọng đọc',onclick:e=>{P.voice=P.voice===false;save();e.currentTarget.textContent=P.voice===false?'🤐':'🗣️';if(P.voice===false)try{speechSynthesis.cancel()}catch(_){}}},P.voice===false?'🤐':'🗣️'),
    h('button',{class:'tog',title:'Bật/tắt âm thanh',onclick:e=>{P.mute=!P.mute;save();e.currentTarget.textContent=P.mute?'🔇':'🔊'}},P.mute?'🔇':'🔊'));
}
function askName(){
  let av=P.avatar||AVATARS[0];
  const inp=h('input',{class:'nameinp',placeholder:'Tên của bạn',maxlength:'20',value:P.name||''});
  const avs=h('div',{class:'avs'});
  AVATARS.forEach(a=>{const b=h('button',{class:a===av?'sel':'',onclick:()=>{av=a;avs.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');beep(600,.06)}},a);avs.append(b)});
  const m=h('div',{class:'modal'},h('div',{class:'box'},
    h('div',{style:'display:flex;justify-content:center'},mascot(110)),
    h('div',{style:'font-size:1.4rem;font-weight:800'},'Chào bạn! Mình là Mimo 👋'),
    h('div',{class:'small',style:'margin-bottom:10px'},'Bạn tên là gì? Chọn một bạn đồng hành nhé!'),
    inp,avs,
    h('button',{class:'btn pri big',onclick:()=>{P.name=inp.value.trim()||'bạn';P.avatar=av;save();m.remove();renderMap();speak(`Chào ${P.name}! Cùng Mimo phiêu lưu toán học nào!`)}},'Bắt đầu! 🚀')));
  document.body.append(m);setTimeout(()=>inp.focus(),100);
}
function renderMap(){
  G.bubble=null;G.owl=null;G.hintFn=null;hidePad();
  app.innerHTML='';app.append(hud(false));
  const doneN=Object.keys(P.stars).length;
  const next=QS.find(q=>!P.stars[q.id]);
  const owl=mascot(96);G.owl=owl;const bub=h('div',{class:'bubble'});G.bubble=bub;
  app.append(h('div',{class:'scene'},owl,h('div',{class:'bwrap'},bub,h('button',{class:'spk',title:'Nghe',onclick:()=>speak(G.lastSay||'')},'🔈'))));
  G.lastSay=doneN===0?`Chào ${P.name||'bạn'}! Mỗi câu trong đề thi là một trò chơi. Bấm vào ô số <b>1</b> để bắt đầu nhé!`
    :doneN===50?`Wow, ${P.name||'bạn'} đã hoàn thành cả 50 câu! Chơi lại để gom đủ 3 sao nhé! 🏆`
    :`Bạn đã xong ${doneN}/50 câu, giỏi lắm! Câu tiếp theo là câu <b>${next.id}</b> đang nhấp nháy đó.`;
  bub.innerHTML=T(G.lastSay);
  SECS.forEach((s,si)=>{
    const qs=QS.filter(q=>q.sec===si),th=THEME[si],dn=qs.filter(q=>P.stars[q.id]).length;
    const isl=h('div',{class:'island',style:`--c1:${th.c1};--c2:${th.c2}`});
    isl.append(h('div',{class:'banner'},h('span',{class:'be'},s.e),h('div',{},h('b',{},s.t),h('div',{class:'small'},s.s)),h('span',{class:'bc'},`${dn}/${qs.length}`)));
    const W=320,gap=104,H=qs.length*gap+20;
    const pts=qs.map((q,i)=>[W/2+Math.sin(i*1.15+si*.7)*92,58+i*gap]);
    let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=` C${x0} ${y0+gap/2} ${x1} ${y1-gap/2} ${x1} ${y1}`}
    const path=h('div',{class:'path',style:`height:${H}px`,html:`<svg class="road" width="${W}" height="${H}"><path d="${d}"/><path class="d" d="${d}"/></svg>`});
    qs.forEach((q,i)=>{const [x,y]=pts[i];const st=P.stars[q.id]||0;
      path.append(h('span',{class:'deco',style:`left:${x<W/2?W-40:4}px;top:${y-20}px`},th.deco[i%th.deco.length]));
      const nb=h('button',{class:'node'+(st?' done':'')+(q===next?' next':''),style:`left:${x-39}px;top:${y-39}px`,title:'Câu '+q.id,onclick:()=>{beep(700,.06);location.hash='q'+q.id}},
        String(q.id),h('span',{class:'ns',html:'<b>'+'★'.repeat(st)+'</b>'+'★'.repeat(3-st)}));
      path.append(nb);
      if(q===next)path.append(h('span',{class:'here',style:`left:${x+22}px;top:${y-62}px`},P.avatar||'🙂'));
    });
    isl.append(path);app.append(isl);
  });
  app.append(h('div',{class:'center',style:'display:flex;gap:10px;justify-content:center;flex-wrap:wrap'},
    h('button',{class:'btn y',onclick:()=>{location.hash='album'}},'📒 Bộ sưu tập nhãn dán'),
    h('button',{class:'btn',onclick:()=>{if(confirm('Xóa toàn bộ tiến độ, sao và nhãn dán?')){P.stars={};save();renderMap()}}},'🗑️ Chơi lại từ đầu')));
  if(!P.name)setTimeout(askName,300);
  if(next&&doneN>0)setTimeout(()=>{const n=document.querySelector('.node.next');n&&n.scrollIntoView({behavior:'smooth',block:'center'})},200);
  else window.scrollTo(0,0);
}
function renderAlbum(){
  G.bubble=null;G.owl=null;hidePad();app.innerHTML='';
  const hd=hud(false);hd.firstChild.replaceWith(h('button',{class:'round',onclick:()=>{location.hash=''}},'✕'));app.append(hd);
  const n=Object.keys(P.stars).length;
  const card=h('div',{class:'card'},h('div',{style:'font-size:1.4rem;font-weight:800'},`📒 Bộ sưu tập nhãn dán (${n}/50)`),
    h('div',{class:'small',style:'margin-bottom:12px'},'Hoàn thành mỗi câu để nhận một nhãn dán. Bấm vào nhãn dán để nghe tiếng của nó!'));
  const g=h('div',{class:'album'});
  QS.forEach(q=>{const has=!!P.stars[q.id];
    g.append(h('button',{class:'slotS'+(has?'':' no'),onclick:()=>{if(has){beep(500+q.id*12,.12);beep(800,.1)}else{location.hash='q'+q.id}}},
      h('span',{class:'se'},STICKERS[q.id-1]),h('span',{class:'small'},has?'⭐'.repeat(P.stars[q.id]):'Câu '+q.id)))});
  card.append(g);app.append(card);window.scrollTo(0,0);
}
function renderQ(id){
  const q=QS[id-1];if(!q){renderMap();return}
  Object.assign(G,{q,mist:0,hint:0,hintFn:null,finished:false});
  hidePad();app.innerHTML='';
  app.append(hud(true));
  G.prog=(i,n)=>{const b=document.getElementById('pbar');if(b)b.style.width=Math.min(100,100*i/n)+'%'};
  const sec=SECS[q.sec],th=THEME[q.sec];
  const owl=mascot(100);G.owl=owl;const bub=h('div',{class:'bubble'});G.bubble=bub;
  app.append(h('div',{class:'scene'},owl,h('div',{class:'bwrap'},bub,h('button',{class:'spk',title:'Nghe lại',onclick:()=>speak(G.lastSay||'')},'🔈'))));
  const card=h('div',{class:'card qcard',style:`--c1:${th.c1};--c2:${th.c2}`});
  card.append(h('div',{class:'qhead'},h('span',{class:'qnum'},String(id)),h('span',{class:'chip'},`${sec.e} ${sec.t}`),h('span',{class:'chip'},`${fmt(q.pts)} điểm`),
    P.stars[id]?h('span',{class:'chip',html:'⭐'.repeat(P.stars[id])}):null,
    h('button',{class:'spk',onclick:()=>speak(`Câu ${id}. ${q.vi}`)},'🔈 Nghe đề')));
  card.append(h('div',{class:'qtext',html:T(q.vi)}));
  card.append(h('details',{class:'en'},h('summary',{},'Đề gốc (tiếng Anh)'),h('div',{},q.en)));
  app.append(card);
  const area=h('div',{class:'card game-area'});app.append(area);
  app.append(h('div',{class:'bottombar'},
    h('div',{style:'display:flex;gap:10px;align-items:center'},
      h('button',{class:'hintbtn',title:'Gợi ý',onclick:useHint},'💡'),
      h('button',{class:'btn',onclick:()=>renderQ(id)},'🔄 Chơi lại')),
    h('div',{style:'display:flex;gap:8px'},
      id>1?h('button',{class:'btn',onclick:()=>{location.hash='q'+(id-1)}},'⬅'):null,
      id<50?h('button',{class:'btn pri',onclick:()=>{location.hash='q'+(id+1)}},'Câu tiếp ➡'):null)));
  say('Cùng Mimo làm từng bước nhé! Cần trợ giúp thì bấm 💡.');
  q.play(area);
  window.scrollTo(0,0);
}
function confetti(){const em=['🎉','⭐','🎊','✨','🌟','🍬','🎈'];for(let i=0;i<50;i++){const d=h('div',{class:'conf',style:`left:${Math.random()*100}vw;animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s`},pick(em));document.body.append(d);setTimeout(()=>d.remove(),6000)}}
function finish(){
  if(G.finished)return;G.finished=true;G.hintFn=null;hidePad();
  G.prog&&G.prog(1,1);
  const q=G.q,pen=G.mist+G.hint,stars=pen===0?3:pen<=2?2:1;
  const prev=P.stars[q.id]||0;const first=!prev;if(stars>prev)P.stars[q.id]=stars;save();
  const earned=Math.max(0,stars-prev)*10;
  setMood('happy');
  setTimeout(()=>{
    sWin();confetti();
    const name=P.name||'bạn';
    const big=mascot(130);big.classList.add('mood-happy','dance');
    const msg=stars===3?'Hoàn hảo! Không sai, không cần gợi ý!':stars===2?'Rất tốt! Chơi lại để lấy đủ 3 sao nhé!':'Bạn đã hoàn thành! Chơi lại để được nhiều sao hơn nha!';
    const m=h('div',{class:'celebrate'},h('div',{class:'box'},
      h('div',{style:'display:flex;justify-content:center;margin-top:-70px'},big),
      h('div',{style:'font-size:1.7rem;font-weight:800'},`Hoan hô, ${name}! 🎉`),
      h('div',{class:'bigstars',html:[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}" style="animation-delay:${.2+i*.35}s">⭐</span>`).join('')}),
      h('div',{},msg),
      earned?h('div',{class:'coins'},`+${earned} 🪙`):null,
      first?h('div',{},h('div',{class:'sticker'},h('span',{class:'se'},STICKERS[q.id-1]),h('b',{},'Nhãn dán mới!'))):null,
      h('div',{class:'small'},`Lần sai: ${G.mist} · Gợi ý: ${G.hint}`),
      h('div',{style:'display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap'},
        h('button',{class:'btn',onclick:()=>m.remove()},'👀 Xem lại'),
        h('button',{class:'btn',onclick:()=>{m.remove();renderQ(q.id)}},'🔄'),
        q.id<50?h('button',{class:'btn pri big',onclick:()=>{m.remove();location.hash='q'+(q.id+1)}},'Tiếp tục ➡'):h('button',{class:'btn pri big',onclick:()=>{m.remove();location.hash=''}},'🗺️ Bản đồ'))));
    document.body.append(m);
    [1,2,3].forEach(i=>{if(i<=stars)setTimeout(()=>beep(600+i*150,.15),200+i*350)});
    speak(`Hoan hô ${name}! Bạn được ${stars} sao! ${first?'Bạn nhận được một nhãn dán mới!':''}`);
  },700);
}
function route(){
  document.querySelectorAll('.modal,.celebrate').forEach(e=>e.remove());
  try{speechSynthesis.cancel()}catch(e){}
  const m=location.hash.match(/^#q(\d+)$/);
  if(m)renderQ(+m[1]);else if(location.hash==='#album')renderAlbum();else renderMap();
}
window.addEventListener('hashchange',route);
route();
